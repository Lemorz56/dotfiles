# AeroSpace config matching as many WHKD keybinds as possible

#'exec-and-forget borders active_color=0xffe1e3e4 inactive_color=0xff494d64 width=5.0'
after-startup-command = [
    'exec-and-forget borders'
]

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
default-root-container-layout = 'tiles'
accordion-padding = 30

# Normalizations. See: https://nikitabobko.github.io/AeroSpace/guide#normalization
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# [[on-window-detected]]
# if.app-id = "com.mitchellh.ghostty"
# check-further-callbacks = true
# run = "layout floating"

[key-mapping]
preset = 'qwerty'

[gaps]
inner.horizontal = 10
inner.vertical =   10
outer.left =       10
outer.bottom =     10
outer.top =        10
outer.right =      10

[mode.main.binding]
# Focus windows
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

    # See: https://nikitabobko.github.io/AeroSpace/commands#workspace-back-and-forth
    alt-tab = 'workspace-back-and-forth'
    # See: https://nikitabobko.github.io/AeroSpace/commands#move-workspace-to-monitor
    alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

# Move windows
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

alt-shift-f = 'fullscreen'

# Resize (no vertical/horizontal distinction, only smart resizing)
alt-equal = 'resize smart +50'
alt-minus = 'resize smart -50'

# Layouts (Accordion and Tiles, with orientation)
alt-slash = 'layout tiles horizontal vertical'
alt-comma = 'layout accordion horizontal vertical'

# Workspace switching (add more as needed)
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'

# Move window to workspace
alt-shift-1 = 'move-node-to-workspace 1'
alt-shift-2 = 'move-node-to-workspace 2'
alt-shift-3 = 'move-node-to-workspace 3'

# Toggle between binding modes (service mode for advanced commands)
alt-shift-semicolon = 'mode service'

# Close focused window (Q is used in your WHKD config as close)
#alt-q = 'close'

# Floating/Tiling toggle (mapped from "toggle-float" in Komorebi)
alt-t = 'layout floating tiling'
alt-m = 'macos-native-minimize'
alt-f = 'fullscreen'

# Retile/reset layout (analogous to "retile")
alt-shift-r = 'flatten-workspace-tree'

alt-p = 'enable toggle'

# Add more workspaces if desired
# alt-4 = 'workspace 4'
# alt-shift-4 = 'move-node-to-workspace 4'

[mode.service.binding]
    esc = ['reload-config', 'mode main']
    r = ['flatten-workspace-tree', 'mode main'] # reset layout
    f = ['layout floating tiling', 'mode main'] # toggle float/tiling
    a = ['layout accordion horizontal vertical', 'mode main'] # toggle accordion layout
    backspace = ['close-all-windows-but-current', 'mode main']
    alt-shift-h = ['join-with left', 'mode main']
    alt-shift-j = ['join-with down', 'mode main']
    alt-shift-k = ['join-with up', 'mode main']
    alt-shift-l = ['join-with right', 'mode main']

[workspace-to-monitor-force-assignment]
    1 = 1                            # Monitor sequence number from left to right. 1-based indexing
    # 2 = 'main'                       # Main monitor
    2 = 1
    # if at offce - toggle below on
    3 = 2
    # 3 = 'main'                       # Non-main monitor in case when there are only two monitors
    # if at home - toggle below on
    # 3 = 'secondary'                # Non-main monitor in case when there are only two monitors
#
    #4 = 'built-in'                  # Case insensitive regex substring
    #5 = '^built-in retina display$' # Case insensitive regex match
